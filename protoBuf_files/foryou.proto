syntax = "proto3";
package com.abolfazlMokhtari.pounes.proto;

message Users {
   repeated User users = 1;
}

message User {
  string _id = 1;
  int64 telegramId = 2;
  string fullName = 3;
  int32 age = 4;
  string gender = 5;
  string lookingFor = 6;
  string state = 7;
  int64 lastSeen = 8;
  int64 lastUpdate = 9;
  bool sleep = 10;
  string education = 11;
  string dietaryPreference = 12;
  string job = 13;
  string workout = 14;
  string sleepingHabits = 15;
  string pets = 16;
  string bio = 17;
  int32 score = 18;
  repeated string profileImages = 19;
  string inviteCode = 20;
}



